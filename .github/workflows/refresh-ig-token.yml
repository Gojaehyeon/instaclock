name: Refresh IG long-lived token

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

concurrency:
  group: refresh-ig-token
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_nYcX7W1hfzHOQj3nhOx67oFL
      VERCEL_PROJECT_ID: prj_GXgYbJiWnVX3oJqjWAQhwnQiOrDf
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull current production env
        run: |
          vercel env pull .env.prod \
            --environment=production --yes \
            --token="$VERCEL_TOKEN"

      - name: Refresh long-lived token
        id: refresh
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source .env.prod
          if [ -z "${IG_TOKEN:-}" ]; then
            echo "::error::IG_TOKEN missing in Vercel production env"
            exit 1
          fi
          resp=$(curl -sS -m 15 \
            "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_TOKEN}")
          new_token=$(printf '%s' "$resp" | jq -r '.access_token // empty')
          expires_in=$(printf '%s' "$resp" | jq -r '.expires_in // empty')
          if [ -z "$new_token" ]; then
            echo "::error::refresh failed: $resp"
            exit 1
          fi
          printf '%s' "$new_token" > .new_token
          echo "expires_in=$expires_in" >> "$GITHUB_OUTPUT"
          echo "Token refreshed. New TTL: $((expires_in / 86400)) days"

      - name: Replace IG_TOKEN on Vercel
        run: |
          set -euo pipefail
          vercel env rm IG_TOKEN production --yes --token="$VERCEL_TOKEN"
          cat .new_token | vercel env add IG_TOKEN production --token="$VERCEL_TOKEN"

      - name: Redeploy production
        run: |
          vercel --prod --yes --token="$VERCEL_TOKEN"

      - name: Cleanup
        if: always()
        run: rm -f .env.prod .new_token
