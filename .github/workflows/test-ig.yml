name: test-instagram-fetch
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try IG web_profile_info API
        run: |
          set +e
          echo "=== HTML page (warmup for cookies) ==="
          curl -s -D /tmp/h1 -c /tmp/cookies \
            -H 'User-Agent: Mozilla/5.0 (Linux; Android 13; SM-S918B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Mobile Safari/537.36' \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'Sec-Fetch-Dest: document' \
            -H 'Sec-Fetch-Mode: navigate' \
            -H 'Sec-Fetch-Site: none' \
            -H 'Upgrade-Insecure-Requests: 1' \
            'https://www.instagram.com/gojaehyun.go/' -o /tmp/html
          head -1 /tmp/h1
          echo "html bytes: $(wc -c < /tmp/html)"
          echo "cookies received: $(wc -l < /tmp/cookies)"

          echo
          echo "=== web_profile_info API ==="
          curl -s -D /tmp/h2 -b /tmp/cookies \
            -H 'User-Agent: Mozilla/5.0 (Linux; Android 13; SM-S918B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Mobile Safari/537.36' \
            -H 'x-ig-app-id: 936619743392459' \
            -H 'X-Requested-With: XMLHttpRequest' \
            -H 'X-ASBD-ID: 129477' \
            -H 'Accept: */*' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'Sec-Fetch-Site: same-origin' \
            -H 'Sec-Fetch-Mode: cors' \
            -H 'Sec-Fetch-Dest: empty' \
            -H 'Referer: https://www.instagram.com/gojaehyun.go/' \
            -H 'Origin: https://www.instagram.com' \
            'https://www.instagram.com/api/v1/users/web_profile_info/?username=gojaehyun.go' -o /tmp/api
          head -1 /tmp/h2
          echo "api bytes: $(wc -c < /tmp/api)"
          echo "first 300 bytes:"
          head -c 300 /tmp/api
          echo
          echo "edge_followed_by match: $(grep -oE '"edge_followed_by":\{"count":[0-9]+' /tmp/api | head -1 || echo NONE)"
